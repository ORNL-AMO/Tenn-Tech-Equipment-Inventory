<button type="button" [disabled]="webcamPermission" (click)="checkPermission()">Give Camera permission</button><br>
@if(webcamPermission){
<div>
    <button type="button" (click)="chooseDevice()">{{showDevices? 'Choose A Device' : 'List Cameras'}}</button>
    Current Selection: {{currentDevice}}
    @if(showDevices){<div>
        <ul class="List">
            @for (let device of mediaDevices){
            <li>
                <button class="devices" type="button" (click)="selectDevice(device)">Select {{device.label}}</button>
            </li>
            }
        </ul>
    </div>}
    <div>
        @if(!camOn){ <button type="button" (click)="startCam()">Start Camera</button>}
        @if(camOn){ <button type="button" (click)="stopCam()">Stop Camera</button>}
    </div>
    <div>
        <div class="webcam">
            <video id="videoElement" #videoElement></video>
        </div>
        <div>
            @if(camOn){<button type="button" (click)="capCam()">Capture</button>}
        </div>
    </div>
    <div>
        @if(capturedImageDataUrl){<img [ngSrc]="capturedImageDataUrl" alt="Captured frame" width="100" height="100" />}
    </div>
</div>}
