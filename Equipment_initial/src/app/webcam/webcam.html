@if(webcamPermission){
<div>

        Cameras'}}</button>
    Current Selection: {{currentDevice}} -->
    <!-- @if(false){<div>

    <mat-form-field>
        <mat-label>Camera</mat-label>
        <mat-select required [(value)]="selectedDevice" (selectionChange)="selectDevice($event.value)">
            @for (device of mediaDevices; track device.deviceId){
                <mat-option [value]="device" > {{ device.label }}</mat-option>
            }
        </mat-select>
    </mat-form-field>
    <div>
        <button matButton="tonal" type="button" [disabled]="camOn" (click)="startCam()">Start Camera</button>
        <button matButton="tonal" type="button" [disabled]="!camOn" (click)="stopCam()">Stop Camera</button>
    </div>
    <div>
        <div class="webcam">
            <video id="videoElement" #videoElement autoplay playsinline></video>
        </div>
        <div>
            @if(camOn){<button matButton="filled" type="button" (click)="capCam()">Capture</button>}
        </div>
    </div>
    <div>
        @if(capturedImageDataUrl){<img [src]="capturedImageDataUrl" alt="Captured frame" />}
    </div>
</div>}
