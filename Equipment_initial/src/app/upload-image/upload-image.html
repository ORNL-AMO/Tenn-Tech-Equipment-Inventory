<div>
    <button matButton="filled" type="button" (click)="openHelpDialog()">
        <mat-icon>help_outline</mat-icon>Help
    </button>
        <button matButton class="example-trigger" (click)="openExampleDialog()" >Example</button>
</div>
<div class="app-container">
    <mat-form-field appearance="outline">
        <mat-label>
            <mat-icon>file_upload</mat-icon>Drop only .png, .jpg, .jpeg files!
        </mat-label>
        <ngx-mat-dropzone>
            <input type="file" fileInput mode="replace" multiple [formControl]="profileImg"
                accept="image/jpg, image/jpeg, image/png" (selectionChange)="onControlChange()" />
            @for (image of images; track image.name) {
            <mat-chip-row>
                {{ image.name }}
            </mat-chip-row>
            }
        </ngx-mat-dropzone>
        <mat-error>Only image files allowed!</mat-error>
    </mat-form-field>

    <div style="width: 40px"></div>
</div>
