<div>
    <!-- Help Button -->
    <button matButton="filled" type="button" (click)="openHelpDialog()">
        <mat-icon>help_outline</mat-icon>Help
    </button>
    <!-- Examples button -->
    <button matButton class="example-trigger" (click)="openExampleDialog()">Example</button>
</div>

<div class="app-container">
    <!-- File upload form field -->
    <mat-form-field appearance="outline">
        <mat-label>
            <mat-icon>file_upload</mat-icon>Drop only .png, .jpg, .jpeg files!
        </mat-label>
        <!-- ngx-mat-dropzone allows for drag-n-drop of files to web page -->
        <ngx-mat-dropzone>
            <!-- fileInput = drag-n-drop connection
                 (selectionChange) is triggered anytime the uploaded files changes -->
            <input type="file" fileInput mode="replace" multiple [formControl]="uploadedFiles"
                accept="image/jpg, image/jpeg, image/png" (selectionChange)="onControlChange()" />
            <!-- Display an array of the uploaded files -->
            @for (image of images; track image.name) {
            <mat-chip-row>
                {{ image.name }}
            </mat-chip-row>
            }
        </ngx-mat-dropzone>
        <!-- Error message if files not part of accepted list -->
        <mat-error>Only image files allowed!</mat-error>
    </mat-form-field>
    <!-- Spacing -->
    <div style="width: 40px"></div>
</div>
