<section>
    <div class="help">
        <button class="helpBtn" matButton="filled" type="button" (click)="openHelpDialog()">
            <p><mat-icon class="help-icon">help_outline</mat-icon>Help</p>
        </button>
    </div>
    <div class="example-wrap">
        <span class="example-trigger">Example</span>
        <mat-card class="mat-surface-container-highest" appearance="outlined">
            <img mat-card-l-image class="example-img" src="assets/motor-nameplate-example1.jpg"
                alt="Motor nameplate example 1">
            <img mat-card-l-image class="example-img" src="assets/motor-nameplate-example2.jpg"
                alt="Motor nameplate example 2" />
            <img mat-card-l-image class="example-img" src="assets/motor-nameplate-example3.jpg"
                alt="Motor nameplate example 3" />
        </mat-card>
    </div>
</section>

<section>
    <label for="files">Select Image:</label>
    <input type="file" id="fileInput" placeholder="Upload Image Here" accept=".jpg, .jpeg, .png"
        (change)="selectFile($event)" multiple />
</section>
