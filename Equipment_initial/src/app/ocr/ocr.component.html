<app-upload-image (fileAdded)="onFileSelected($event)" [fileRemoved]="fileRemove" />
<app-webcam (fileSelected)="onFileSelected($event)" />
<mat-divider style="margin: 20px 0px"></mat-divider>
@if(filesInput.length > 0){
<div class="preview-reopen-bar">
    <span>{{ filesInput.length }} file{{ filesInput.length === 1 ? '' : 's' }} selected</span>
    <button matButton="tonal" type="button" (click)="openPreviewDialog()">Review Selected Images</button>
</div>
}

@if(inventory.length > 0){
<div class="preview-reopen-bar">
    <span>{{ inventory.length }} scanned item{{ inventory.length === 1 ? '' : 's' }} ready to review</span>
    <button matButton="tonal" type="button" (click)="openInventoryReviewDialog()">Review Scanner Inventory</button>
</div>
}

<p>Upload an image to process</p>
