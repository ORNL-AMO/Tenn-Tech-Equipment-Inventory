<label for="files">Select Image:</label>

<input type="file" id="fileInput" placeholder="Upload Image Here" accept=".jpg, .jpeg, .png"
    (change)="onFileSelected($event)" />
<button type="button" (click)="onUpload()">Scan Image (temp click twice)</button>

<p *ngIf="loading">Extracting text...</p>

<h4>Raw Result</h4>
<pre>{{ result }}</pre>
<h4>Cleaned Text</h4>
<pre>{{ cleanedText }}</pre>
